version: "3.9"
services:
  mongo:
    image: mongo:latest
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    # Uncomment below lines if you want to persist data on the host:
    # volumes:
    #   - mongo_data:/data/db

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi  # Point to the Dockerfile for the FastAPI app
    container_name: fastapi_app
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000
    environment:
      # Example env var that the FastAPI app might use to connect to MongoDB
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo
    ports:
      - "8000:8000"

